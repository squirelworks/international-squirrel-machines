name: device-projects

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: device-projects-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover projects
        id: set
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            MATRIX=$(python3 scripts/discover_projects.py --all)
          else
            BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
            HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              MATRIX=$(python3 scripts/discover_projects.py --all)
            else
              MATRIX=$(python3 scripts/discover_projects.py --base "$BASE" --head "$HEAD")
            fi
          fi
          {
            echo "matrix<<EOF"
            echo "$MATRIX"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Discovered matrix: $MATRIX"

  check:
    needs: discover
    if: needs.discover.outputs.matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Skip placeholder
        if: matrix.project == '__none__'
        run: echo "No projects to check"

      - uses: actions/checkout@v4
        if: matrix.project != '__none__'

      - name: Install tools for project
        if: matrix.project != '__none__'
        run: |
          set -euo pipefail
          PROJECT="${{ matrix.project }}"
          shopt -s nullglob
          need_kicad=0
          need_scad=0
          if compgen -G "${PROJECT}/*.kicad_pro" > /dev/null; then need_kicad=1; fi
          if compgen -G "${PROJECT}/*.scad" > /dev/null; then need_scad=1; fi
          echo "need_kicad=${need_kicad} need_scad=${need_scad}"

          sudo apt-get update

          if [[ "$need_scad" == "1" ]] && ! command -v openscad >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openscad
            openscad --version | head -1
          fi

          if [[ "$need_kicad" == "1" ]] && ! command -v kicad-cli >/dev/null 2>&1; then
            # Avoid add-apt-repository/launchpadlib (flaky IncompleteRead on GHA).
            # KiCad 8.0 PPA signing key (Launchpad kicad team).
            sudo apt-get install -y --no-install-recommends curl gnupg ca-certificates
            sudo mkdir -p /etc/apt/keyrings
            KEY_URL='https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x245FC62B98D138C6C33B81780B25B31014947966'
            for attempt in 1 2 3 4 5; do
              if curl -fsSL "$KEY_URL" | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/kicad-archive-keyring.gpg; then
                break
              fi
              echo "key fetch failed (attempt ${attempt}); retrying..."
              sleep $((attempt * 4))
              if [[ "$attempt" == "5" ]]; then
                echo "error: could not fetch KiCad PPA signing key" >&2
                exit 1
              fi
            done
            codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
            echo "deb [signed-by=/etc/apt/keyrings/kicad-archive-keyring.gpg] https://ppa.launchpadcontent.net/kicad/kicad-8.0-releases/ubuntu ${codename} main" \
              | sudo tee /etc/apt/sources.list.d/kicad-8.list >/dev/null
            for attempt in 1 2 3 4 5; do
              if sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kicad; then
                break
              fi
              echo "kicad install failed (attempt ${attempt}); retrying..."
              sleep $((attempt * 5))
              if [[ "$attempt" == "5" ]]; then
                echo "error: could not install kicad" >&2
                exit 1
              fi
            done
            kicad-cli version
          fi

      - name: Check project
        if: matrix.project != '__none__'
        run: |
          chmod +x scripts/ci_check_project.sh
          scripts/ci_check_project.sh "${{ matrix.project }}"
