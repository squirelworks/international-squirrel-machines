device: storage/flash-cards
vid_pid: "0x1209/0x0019"
build_vs_wrap: wrap_commodity_microsd

usb:
  connector: J1
  role: device_bringup

socket:
  connector: J2
  footprint: Hirose_DM3AT-SF-PEJM5
  mode: spi
  pins:
    CLK: { module_pad: 2, gpio: 0 }
    MOSI_CMD: { module_pad: 3, gpio: 1 }
    MISO_DAT0: { module_pad: 4, gpio: 2 }
    CS_DAT3: { module_pad: 5, gpio: 3 }
    DET: { module_pad: 6, gpio: 4, active: low }

tests:
  - name: enumerate_usb
    expect: "VID 0x1209 PID 0x0019"
  - name: card_detect
    expect: "DET asserts LED when card inserted"
  - name: msc_read_verify
    status: follow_up
