schema_version: "1.0.0"
aircraft_id: "ISM-FJ-1"
revision: "A"
status: stub
issue: 76
related_issues: [122]
provisional: true
source_drawings: ["ISM-FJ-DWG-010", "ISM-FJ-DWG-020", "ISM-FJ-DWG-050", "ISM-FJ-DWG-080"]
source_docs:
  - fighter-jet/sensors-weapons/radar-eo.md
  - fighter-jet/sensors-weapons/sensor-integration.md
  - fighter-jet/avionics/sensors-nav.md
  - fighter-jet/sensors-weapons/ew.md
related_interfaces:
  - avionics-bus.yaml
  - avionics-architecture.yaml
  - flight-controls.yaml
hard_stop: no_missile_seekers_warheads_fuzing_guidance
scope: physical_integration_only
excluded:
  - rf_eo_performance_prediction
  - waveforms
  - frequencies
  - tactics
  - seekers
  - guidance
  - warheads
  - fuzing

imu:
  id: ISM-IMU
  lanes: 3
  bay_slot: D
  mount_fs_pct: 0.48
  output_rate_hz: 200
  axes: [p, q, r, ax, ay, az]
  align_modes: [ground_gyrocompass, gnss_aided]
  validity_timeout_ms: 50
  power: {rail: essential_28V, budget_w: 25}
  data: {bus: ISM-Bus-A, topic: imu.state, rate_hz: 200}
  cooling: passive_tray
  provisional: true

gnss:
  id: ISM-GNSS
  rate_hz: 10
  constellations: [multi]
  fcc_hard_depend: false
  antenna_mount: {location: spine_or_fin, fs_pct_range: [0.70, 0.85]}
  power: {rail: essential_28V, budget_w: 8}
  data: {bus: ISM-Bus-A, topic: gnss.state, rate_hz: 10}
  provisional: true

air_data:
  id: ISM-ADC
  channels: 2
  outputs: [keas, pressure_altitude_m, mach, oat_c]
  aoa_probes: 2
  sideslip_probes: 1
  probe_mounts:
    - {id: pitot_L, fs_pct: 0.12, bl_side: left}
    - {id: pitot_R, fs_pct: 0.12, bl_side: right}
    - {id: aoa_L, fs_pct: 0.15, bl_side: left}
    - {id: aoa_R, fs_pct: 0.15, bl_side: right}
    - {id: aos, fs_pct: 0.10, location: nose_boom_or_ventral}
  rate_hz: 100
  disagree_threshold: {aoa_deg: 3.0, keas_kt: 8.0}
  power: {rail: essential_28V, budget_w: 15}
  data: {bus: ISM-Bus-A, topic: air_data.state, rate_hz: 100}
  provisional: true

radar:
  id: ISM-R1
  fictional: true
  role: fire_control_aesa
  mount:
    location: nose_radome
    fs_pct: 0.05
    drawing: ISM-FJ-DWG-050
    study_xyz_mm: [21, 0, 28]  # ~0.05*420, WL mid
  aperture:
    face: forward
    radome_material: ISM-RF-Q
  scan_modes: [search, track, stt, weather_map_lite]
  track_capacity_stub: 16
  field_of_regard_deg: {az: [-60, 60], el: [-30, 30]}
  cooling: {type: ecs_or_liquid, budget_kw_class: 2_to_5}
  power: {rail: primary_28V, budget_w: 2500, bus_tie_ok: true}
  data:
    control_bus: ISM-Bus-A
    track_bus: Sensor-Fabric-S1
    topics:
      - {name: mc.radar_tracks, rate_hz: 20}
      - {name: mc.radar_mode, rate_hz: 5}
      - {name: mc.radar_bit, rate_hz: 1}
  keepouts: [crew_pressure_vessel, gear_doors_when_open_lower_hemi]
  owner: MC
  fcc_use: cueing_only_not_flight_critical

eo_ir:
  id: ISM-EO1
  fictional: true
  role: irst_tv
  mount:
    location: ventral_nose_chin
    fs_pct: 0.08
    study_xyz_mm: [34, 0, 8]
    drawing: ISM-FJ-DWG-050
  modes: [ir_search, tv]
  slew_rate_deg_s: 60
  field_of_regard_deg: {az: [-90, 90], el: [-20, 40]}
  cooling: {type: ecs_air, budget_w: 150}
  power: {rail: primary_28V, budget_w: 200}
  data:
    control_bus: ISM-Bus-A
    video_bus: Sensor-Fabric-S1
    topics:
      - {name: mc.eo_tracks, rate_hz: 30}
      - {name: mc.eo_mode, rate_hz: 5}
      - {name: mc.eo_bit, rate_hz: 1}
  keepouts: [NLG_doors_open, ground_taxi_debris]
  owner: MC
  fcc_use: cueing_only

rwr_esm:
  id: ISM-EW-RWR
  fictional: true
  role: emitter_detect_cue_lad
  mounts:
    - {location: wingtip_or_fin, side: left}
    - {location: wingtip_or_fin, side: right}
    - {location: aft_fuselage, side: left}
    - {location: aft_fuselage, side: right}
  power: {rail: primary_28V, budget_w: 80}
  data: {bus: ISM-Bus-A, topic: mc.rwr_emitters, rate_hz: 10}
  owner: MC
  note: non_specific_techniques_only

# Flight Lab / MC stub message list (no seeker / weapon protocol internals)
flight_lab_stubs:
  - topic: imu.state
    rate_hz: 200
    payload: [p, q, r, ax, ay, az, valid]
  - topic: air_data.state
    rate_hz: 100
    payload: [keas, alt_m, mach, aoa_deg, aos_deg, valid]
  - topic: gnss.state
    rate_hz: 10
    payload: [lat, lon, alt_m, sog, valid]
  - topic: mc.radar_tracks
    rate_hz: 20
    payload: [track_id, az_deg, el_deg, range_m, closing_mps, quality]
  - topic: mc.eo_tracks
    rate_hz: 30
    payload: [track_id, az_deg, el_deg, ir_or_tv, quality]
  - topic: mc.rwr_emitters
    rate_hz: 10
    payload: [emitter_id, az_deg, band_class, priority]
  - topic: mc.radar_bit
    rate_hz: 1
    payload: [lru_ok, cooling_ok, power_ok]
  - topic: mc.eo_bit
    rate_hz: 1
    payload: [lru_ok, window_ok, power_ok]

fov_obstructions:
  - sensor: ISM-R1
    blocked_by: [radome_wet_ice_stub, own_stores_extreme_pitch, NLG_doors_open_lower_hemi]
  - sensor: ISM-EO1
    blocked_by: [NLG_door, nose_gear_leg_when_down, ground_plane]
  - sensor: air_data
    blocked_by: [icing, sideslip_extreme]
  - sensor: ISM-GNSS
    blocked_by: [fuselage_shadow_below_antenna]
  - sensor: ISM-EW-RWR
    blocked_by: [own_pylon_store_occultation_stub]

# A4 #122 — aperture envelopes for packaging / FOV / MC stubs
apertures:
  - id: ISM-R1
    station: nose_radome
    drawing: ISM-FJ-DWG-050
    fs_pct: 0.05
    bl_mm: 0
    wl_mm: 28
    study_xyz_mm: [21, 0, 28]
    envelope: {shape: cylinder, diameter_mm: 40, depth_mm: 30, axis: +x}
    mass_kg: 85
    power_W: 2500
    cooling: {type: ecs_or_liquid, budget_kw_class: 2_to_5}
    data_topic: [mc.radar_tracks, mc.radar_bit, mc.radar_mode]
    fov_cone: {az_deg: [-60, 60], el_deg: [-30, 30]}
    keepouts: [crew_pressure_vessel, gear_wells]
  - id: ISM-EO1
    station: ventral_nose_chin
    drawing: ISM-FJ-DWG-050
    fs_pct: 0.08
    bl_mm: 0
    wl_mm: 8
    study_xyz_mm: [34, 0, 8]
    envelope: {shape: box, l_mm: 28, w_mm: 28, h_mm: 35}
    mass_kg: 18
    power_W: 200
    cooling: {type: ecs_air, budget_w: 150}
    data_topic: [mc.eo_tracks, mc.eo_bit, mc.eo_mode]
    fov_cone: {az_deg: [-90, 90], el_deg: [-20, 40]}
    keepouts: [NLG_doors_open, gear_wells]
  - id: ISM-ADC
    station: nose_probes
    drawing: ISM-FJ-DWG-050
    fs_pct: 0.12
    bl_mm: 0
    wl_mm: 30
    study_xyz_mm: [50, 0, 30]
    envelope: {shape: probe_kit, count: 5, each_diameter_mm: 6, each_length_mm: 40}
    mass_kg: 2.5
    power_W: 15
    cooling: {type: passive}
    data_topic: [air_data.state]
    fov_cone: null
    keepouts: []
  - id: ISM-GNSS
    station: spine_or_fin
    drawing: ISM-FJ-DWG-050
    fs_pct: 0.78
    bl_mm: 0
    wl_mm: 58
    study_xyz_mm: [328, 0, 58]
    envelope: {shape: box, l_mm: 40, w_mm: 40, h_mm: 15}
    mass_kg: 0.8
    power_W: 8
    cooling: {type: passive}
    data_topic: [gnss.state]
    fov_cone: {az_deg: [-180, 180], el_deg: [0, 90]}
    keepouts: []
  - id: ISM-IMU
    station: bay_slot_D
    drawing: ISM-FJ-DWG-020
    fs_pct: 0.48
    bl_mm: 0
    wl_mm: 48
    study_xyz_mm: [202, 0, 48]
    envelope: {shape: box, l_mm: 80, w_mm: 60, h_mm: 40}
    mass_kg: 4.5
    power_W: 25
    cooling: {type: passive_tray}
    data_topic: [imu.state]
    fov_cone: null
    keepouts: []
  - id: ISM-EW-RWR
    station: wingtip_fin_aft_quad
    drawing: ISM-FJ-DWG-060
    fs_pct: 0.58
    bl_mm: 140
    wl_mm: 20
    study_xyz_mm: [244, 140, 20]
    envelope: {shape: box, l_mm: 20, w_mm: 20, h_mm: 30, count: 4}
    mass_kg: 4.8
    power_W: 80
    cooling: {type: passive}
    data_topic: [mc.rwr_emitters]
    fov_cone: {az_deg: [-180, 180], el_deg: [-90, 90]}
    keepouts: []
    note: non_specific_techniques_only

nose_oml_containment:
  aperture_id: ISM-R1
  check: shell/check_sensor_apertures.sh
  expected: aperture_inside_nose_interior

expected_behaviour:
  fcc_primary_attitude: imu_plus_air_data
  mc_owns_radar_eo_tracks: true
  soft_sensor_apps_are_steve_lane: true
  loss_of_air_data: degrade_to_conservative_envelope
  no_third_party_sim_as_sot: true
  apertures_packaging_only: true
