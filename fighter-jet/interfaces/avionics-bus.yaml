schema_version: "1.0.0"
aircraft_id: "ISM-FJ-1"
revision: "A"
status: stub
issue: 75
provisional: true
source_docs:
  - fighter-jet/avionics/buses-power.md
  - fighter-jet/avionics/architecture.md
  - fighter-jet/avionics/bus-topology.svg
  - fighter-jet/diagrams/wiring-harness.md
related: avionics-architecture.yaml

buses:
  - id: ISM-Bus-A
    role: primary_mission_flight
    media: dual_redundant_digital
    frame_rate_hz_default: 100
    schedule_owner: FCC
    peers: [FCC, MC, bay_io, radios, HUD_sym_gen, PDU]
  - id: ISM-Bus-B
    role: secondary_isolation
    media: dual_redundant_digital
    frame_rate_hz_default: 100
    schedule_owner: FCC_lane2_side
    peers: [FCC, MC, PDU]
  - id: Sensor-Fabric-S1
    role: radar_eo_to_mc
    media: fiber_stub_preferred
    master: MC
    flight_article: true
  - id: FCC-XChannel
    role: lane_sync
    media: deterministic_short_period
    peers: [FCC_L1, FCC_L2, FCC_L3, FCC_L4]
  - id: ISM-Bay-Debug
    role: development_usb
    media: usb
    flight_article: false
    gated_by: [WOW, maintenance_pin]

topics:
  - name: fcc.surface_cmd
    bus: ISM-Bus-A
    rate_hz: 100
    payload: surface_deflection_commands
  - name: fcc.surface_fb
    bus: ISM-Bus-A
    rate_hz: 100
    payload: surface_position_feedback
  - name: air_data.state
    bus: ISM-Bus-A
    rate_hz: 100
    payload: keas_alt_mach_aoa_ss
  - name: imu.state
    bus: ISM-Bus-A
    rate_hz: 200
    payload: rates_accels
  - name: mc.stores_config
    bus: ISM-Bus-A
    rate_hz: 10
    payload: station_loadout_flags
  - name: mc.radar_tracks
    bus: ISM-Bus-A
    rate_hz: 20
    payload: track_list_stub
  - name: mc.mode_request
    bus: ISM-Bus-A
    rate_hz: 20
    payload: ap_at_modes
  - name: pdu.power_status
    bus: ISM-Bus-B
    rate_hz: 10
    payload: rail_health
  - name: fcc.lane_health
    bus: ISM-Bus-B
    rate_hz: 10
    payload: vote_bit_status
  - name: mc.bit
    bus: ISM-Bus-B
    rate_hz: 10
    payload: mc_lru_health
  - name: bay_io.bit
    bus: ISM-Bus-A
    rate_hz: 10
    payload: concentrator_health
    bit_frame: bit-frame.yaml
    consumers: [HIL_80, MC_81, HUD_82, analyzer_83]

  # A1 #119 — message set for mission-computer stubs (#81), HUD (#82), analyzer (#83)
  - name: mc.nav_state
    bus: ISM-Bus-A
    rate_hz: 50
    payload: lat_lon_alt_vn_ve_vd_stub
    consumers: [MC_81, HUD_82]
  - name: mc.mission_phase
    bus: ISM-Bus-A
    rate_hz: 5
    payload: phase_enum_stub
    consumers: [MC_81, HUD_82]
  - name: hud.symbology_cmd
    bus: ISM-Bus-A
    rate_hz: 30
    payload: cue_list_stub
    consumers: [HUD_82]
  - name: hud.caution_advisory
    bus: ISM-Bus-A
    rate_hz: 10
    payload: cautions_from_bit_and_mc
    consumers: [HUD_82]
  - name: bay_io.actuator_fb
    bus: ISM-Bus-A
    rate_hz: 100
    payload: j1_j4_cmd_echo_normalized
    consumers: [HIL_80, analyzer_83]
  - name: bay_io.inceptor
    bus: ISM-Bus-A
    rate_hz: 100
    payload: stick_throttle_pedal_normalized
    consumers: [MC_81, HIL_80, analyzer_83]
  - name: analyzer.capture_meta
    bus: ISM-Bay-Debug
    rate_hz: 1
    payload: capture_id_rate_filter
    consumers: [analyzer_83]
  - name: analyzer.frame_tap
    bus: ISM-Bay-Debug
    rate_hz: 0
    payload: mirrored_bus_frames
    consumers: [analyzer_83]
    note: on_demand_tap_not_periodic

power:
  primary_vdc: 28
  essential_bus: true
  essential_feeds: [FCC, IMU, essential_HUD, radios]
  hvdc_stub_v: 270
  bay_pcb_study: true
  cross_tie: true

expected_behaviour:
  pinouts: see_connectors-pinouts_and_avionics-architecture
  analyzer_fixtures: future_under_interfaces_or_fixtures
  third_party_sim_not_sot: true
  protocol_ism_original: true
