related: avionics-architecture.yaml

buses:
  - id: ISM-Bus-A
    role: primary_mission_flight
    media: dual_redundant_digital
    frame_rate_hz_default: 100
    schedule_owner: FCC
    peers: [FCC, MC, bay_io, radios, HUD_sym_gen, PDU]
  - id: ISM-Bus-B
    role: secondary_isolation
    media: dual_redundant_digital
    frame_rate_hz_default: 100
    schedule_owner: FCC_lane2_side
    peers: [FCC, MC, PDU]
  - id: Sensor-Fabric-S1
    role: radar_eo_to_mc
    media: fiber_stub_preferred
    master: MC
    flight_article: true
  - id: FCC-XChannel
    role: lane_sync
    media: deterministic_short_period
    peers: [FCC_L1, FCC_L2, FCC_L3, FCC_L4]
  - id: ISM-Bay-Debug
    role: development_usb
    media: usb
    flight_article: false
    gated_by: [WOW, maintenance_pin]

topics:
  - name: fcc.surface_cmd
    bus: ISM-Bus-A
    rate_hz: 100
    payload: surface_deflection_commands
  - name: fcc.surface_fb
    bus: ISM-Bus-A
    rate_hz: 100
    payload: surface_position_feedback
  - name: air_data.state
    bus: ISM-Bus-A
    rate_hz: 100
    payload: keas_alt_mach_aoa_ss
  - name: imu.state
    bus: ISM-Bus-A
    rate_hz: 200
    payload: rates_accels
  - name: mc.stores_config
    bus: ISM-Bus-A
    rate_hz: 10
    payload: station_loadout_flags
  - name: mc.radar_tracks
    bus: ISM-Bus-A
    rate_hz: 20
    payload: track_list_stub
  - name: mc.mode_request
    bus: ISM-Bus-A
    rate_hz: 20
    payload: ap_at_modes
  - name: pdu.power_status
    bus: ISM-Bus-B
    rate_hz: 10
    payload: rail_health
  - name: fcc.lane_health
    bus: ISM-Bus-B
    rate_hz: 10
    payload: vote_bit_status
  - name: mc.bit
    bus: ISM-Bus-B
    rate_hz: 10
    payload: mc_lru_health
  - name: bay_io.bit
    bus: ISM-Bus-A
    rate_hz: 10
    payload: concentrator_health

power:
  primary_vdc: 28
  essential_bus: true
  essential_feeds: [FCC, IMU, essential_HUD, radios]
  hvdc_stub_v: 270
  bay_pcb_study: true
  cross_tie: true

expected_behaviour:
  pinouts: see_connectors-pinouts_and_avionics-architecture
