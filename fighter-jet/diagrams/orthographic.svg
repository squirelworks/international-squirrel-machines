<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="ISM-FJ-1 three-view orthographic">
  <title>ISM-FJ-1 Nutcracker — Orthographic Study</title>
  <desc>Original ISM three-view: plan, side, and front. Study proportions only.</desc>
  <style>
    .bg { fill: #f3f0ea; }
    .frame { fill: none; stroke: #4a453f; stroke-width: 1.2; }
    .air { fill: #cfc8bc; stroke: #3a3530; stroke-width: 1.5; }
    .air-line { fill: none; stroke: #3a3530; stroke-width: 1.5; }
    .dim { fill: none; stroke: #7a7268; stroke-width: 0.8; stroke-dasharray: 4 3; }
    .label { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 13px; fill: #2c2824; }
    .title { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; fill: #2c2824; }
    .sub { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 11px; fill: #5a534c; }
    .accent { fill: #8b6b4a; }
  </style>
  <rect class="bg" width="900" height="640"/>
  <text class="title" x="24" y="32">ISM-FJ-1 “Nutcracker” — Orthographic Study</text>
  <text class="sub" x="24" y="50">International Squirrel Machines · Pure Squirrel-OS/2 · Not to production scale</text>

  <!-- PLAN VIEW -->
  <text class="label" x="24" y="88">PLAN (top)</text>
  <g transform="translate(80,100)">
    <!-- fuselage -->
    <ellipse class="air" cx="260" cy="90" rx="200" ry="18"/>
    <!-- nose -->
    <path class="air" d="M60,90 L90,78 L90,102 Z"/>
    <!-- wings -->
    <path class="air" d="M180,90 L230,90 L310,10 L250,10 Z"/>
    <path class="air" d="M180,90 L230,90 L310,170 L250,170 Z"/>
    <!-- h-tail -->
    <path class="air" d="M400,90 L440,90 L460,55 L430,55 Z"/>
    <path class="air" d="M400,90 L440,90 L460,125 L430,125 Z"/>
    <!-- intakes -->
    <rect class="air" x="140" y="68" width="40" height="12" rx="2"/>
    <rect class="air" x="140" y="100" width="40" height="12" rx="2"/>
    <!-- badge note -->
    <circle class="accent" cx="430" cy="90" r="4"/>
    <text class="sub" x="0" y="200">Span study ~280 (shell units) · Sweep ~35°</text>
  </g>

  <!-- SIDE VIEW -->
  <text class="label" x="24" y="360">SIDE (left)</text>
  <g transform="translate(80,380)">
    <path class="air" d="M40,70
      C80,40 140,30 200,35
      L320,40 L400,50 L440,55 L450,70
      L440,85 L400,90 L200,95
      C140,95 80,90 40,70 Z"/>
    <!-- canopy -->
    <path class="air-line" d="M150,40 C180,18 220,18 250,38"/>
    <!-- intake -->
    <path class="air" d="M110,55 L150,50 L150,75 L115,72 Z"/>
    <!-- v-tail -->
    <path class="air" d="M390,50 L420,50 L440,5 L405,5 Z"/>
    <!-- gear (down concept) -->
    <line class="dim" x1="160" y1="95" x2="160" y2="130"/>
    <line class="dim" x1="300" y1="90" x2="300" y2="130"/>
    <circle class="air-line" cx="160" cy="135" r="8"/>
    <circle class="air-line" cx="300" cy="135" r="10"/>
    <text class="sub" x="0" y="165">Nose gear FS~22% · Main gear FS~55% · Fin ISM badge</text>
  </g>

  <!-- FRONT VIEW -->
  <text class="label" x="560" y="88">FRONT</text>
  <g transform="translate(600,120)">
    <ellipse class="air" cx="100" cy="80" rx="22" ry="28"/>
    <path class="air" d="M100,80 L20,100 L40,108 L100,90 Z"/>
    <path class="air" d="M100,80 L180,100 L160,108 L100,90 Z"/>
    <path class="air" d="M100,52 L100,10 L112,10 L108,52 Z"/>
    <ellipse class="air-line" cx="100" cy="62" rx="14" ry="10"/>
    <rect class="air" x="70" y="78" width="18" height="14" rx="2"/>
    <rect class="air" x="112" y="78" width="18" height="14" rx="2"/>
    <text class="sub" x="0" y="150">Twin intake · Mid wing · Single fin</text>
  </g>

  <rect class="frame" x="16" y="64" width="868" height="560" rx="4"/>
  <text class="sub" x="24" y="620">ISM drawing · Independent design · Contemporaries reference only</text>
</svg>
