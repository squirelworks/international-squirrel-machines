<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="ISM-FJ-DWG-030 section wing root main spar">
  <title>ISM-FJ-DWG-030 Rev A — Section Wing Root / Main Spar</title>
  <desc>Spanwise cut at wing root / carry-through (FS-62) showing front and rear spars. Study mm. Original ISM.</desc>
  <style>
    .bg { fill: #f3f0ea; }
    .fuse { fill: #d5cec2; stroke: #3a3530; stroke-width: 1.5; }
    .wing { fill: #e0d9cc; stroke: #3a3530; stroke-width: 1.4; }
    .spar { stroke: #8b6b4a; stroke-width: 3; fill: none; }
    .rib { stroke: #5a534c; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    .dim { stroke: #7a7268; stroke-width: 0.8; fill: none; }
    .hp { fill: #8b6b4a; }
    .title { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #2c2824; }
    .sub { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 11px; fill: #5a534c; }
    .label { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 12px; fill: #2c2824; }
    .tiny { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 10px; fill: #5a534c; }
  </style>
  <rect class="bg" width="960" height="540"/>
  <text class="title" x="24" y="28">ISM-FJ-DWG-030 Rev A — Section cut FS-62 (wing root / carry-through)</text>
  <text class="sub" x="24" y="46">Looking aft · Units: mm study · Front spar ~15% chord · Rear spar ~65% chord · 1 du = 1 mm</text>

  <g transform="translate(80,100)">
    <!-- fuselage section -->
    <ellipse class="fuse" cx="400" cy="160" rx="70" ry="90"/>
    <text class="tiny" x="375" y="164">Fuselage</text>
    <!-- carry-through box -->
    <rect class="wing" x="330" y="140" width="140" height="40"/>
    <text class="label" x="350" y="130">Carry-through box</text>

    <!-- left wing (mirror) -->
    <path class="wing" d="M330,145 L80,120 L40,175 L330,180 Z"/>
    <!-- right wing -->
    <path class="wing" d="M470,145 L720,120 L760,175 L470,180 Z"/>

    <!-- spars L -->
    <line class="spar" x1="320" y1="150" x2="70" y2="135"/>
    <line class="spar" x1="320" y1="175" x2="55" y2="165"/>
    <!-- spars R -->
    <line class="spar" x1="480" y1="150" x2="730" y2="135"/>
    <line class="spar" x1="480" y1="175" x2="745" y2="165"/>
    <text class="label" x="200" y="110">Front spar</text>
    <text class="label" x="200" y="210">Rear spar</text>
    <text class="label" x="560" y="110">Front spar</text>
    <text class="label" x="560" y="210">Rear spar</text>

    <!-- root rib -->
    <line class="rib" x1="330" y1="120" x2="330" y2="200"/>
    <line class="rib" x1="470" y1="120" x2="470" y2="200"/>
    <text class="tiny" x="300" y="220">WS-0 root rib</text>

    <!-- hardpoint marks WS-2 -->
    <circle class="hp" cx="280" cy="188" r="4"/>
    <circle class="hp" cx="520" cy="188" r="4"/>
    <text class="tiny" x="250" y="240">STA-7/8 @ WS-2</text>
    <text class="tiny" x="500" y="240">STA-7/8 @ WS-2</text>

    <!-- BL / WL -->
    <line class="dim" x1="0" y1="160" x2="800" y2="160"/>
    <text class="tiny" x="780" y="156">WL0</text>
    <line class="dim" x1="400" y1="40" x2="400" y2="280"/>
    <text class="tiny" x="406" y="50">BL-0</text>

    <!-- span dim -->
    <line class="dim" x1="40" y1="300" x2="760" y2="300"/>
    <text class="label" x="320" y="320">Wing span study 280 mm (tip to tip)</text>
  </g>

  <text class="label" x="24" y="480">Hardpoint stations dimensioned on ISM-FJ-DWG-040 · Wing plan ISM-FJ-DWG-060</text>
  <text class="sub" x="24" y="520">ISM drawing · Cite as ISM-FJ-DWG-030 · Contemporaries reference only</text>
</svg>
