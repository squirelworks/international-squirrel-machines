<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="ISM-FJ-1 wing plan with spars and ribs">
  <title>ISM-FJ-1 Wing Plan — Spars &amp; Ribs</title>
  <style>
    .bg { fill: #f3f0ea; }
    .skin { fill: #d9d2c6; stroke: #3a3530; stroke-width: 1.5; }
    .spar { stroke: #8b6b4a; stroke-width: 2.5; fill: none; }
    .rib { stroke: #5a534c; stroke-width: 1; fill: none; }
    .label { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 12px; fill: #2c2824; }
    .title { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #2c2824; }
    .sub { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; font-size: 11px; fill: #5a534c; }
  </style>
  <rect class="bg" width="720" height="420"/>
  <text class="title" x="24" y="28">ISM-FJ-1 — Wing Box Plan (right wing, looking down)</text>
  <text class="sub" x="24" y="46">Front spar ~15% chord · Rear spar ~65% chord · Ribs at WS stations</text>

  <g transform="translate(80,80)">
    <!-- wing outline -->
    <path class="skin" d="M40,40 L280,40 L360,220 L80,220 Z"/>
    <!-- front spar -->
    <line class="spar" x1="70" y1="40" x2="120" y2="220"/>
    <!-- rear spar -->
    <line class="spar" x1="220" y1="40" x2="280" y2="220"/>
    <!-- ribs -->
    <line class="rib" x1="40" y1="70" x2="290" y2="70"/>
    <line class="rib" x1="48" y1="100" x2="300" y2="100"/>
    <line class="rib" x1="56" y1="130" x2="310" y2="130"/>
    <line class="rib" x1="64" y1="160" x2="320" y2="160"/>
    <line class="rib" x1="72" y1="190" x2="340" y2="190"/>
    <!-- aileron -->
    <path class="skin" d="M280,40 L320,40 L360,220 L320,220 Z" opacity="0.55"/>
    <text class="label" x="300" y="130">Aileron</text>
    <text class="label" x="90" y="30">Front spar (composite / Ti fittings)</text>
    <text class="label" x="230" y="30">Rear spar</text>
    <text class="label" x="10" y="250">Root (fuselage)</text>
    <text class="label" x="340" y="250">Tip</text>
    <text class="sub" x="0" y="280">Flap / flaperon region between spars, inboard of aileron. Hardpoints at WS-2 and WS-4 (see sensors-weapons/stores.md).</text>
  </g>
</svg>
