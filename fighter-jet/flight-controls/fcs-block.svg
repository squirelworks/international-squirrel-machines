<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">
  <title>ISM-FJ-1 FCS block diagram — sensors → laws → actuators (#74)</title>
  <rect width="720" height="320" fill="#f4f6f8"/>
  <text x="16" y="22" font-size="14" font-weight="600">ISM-FJ-1 FCS — sensors → FCC laws → EHA (#74)</text>
  <!-- sensors column -->
  <rect x="20" y="50" width="140" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="40" y="75">Inceptors 100 Hz</text>
  <rect x="20" y="100" width="140" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="45" y="125">IMU / air data</text>
  <rect x="20" y="150" width="140" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="30" y="175">Surface position</text>
  <rect x="20" y="200" width="140" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="55" y="225">WOW / gear</text>
  <rect x="20" y="250" width="140" height="40" rx="4" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="35" y="275">MC stores_cfg</text>
  <!-- FCC -->
  <rect x="240" y="100" width="200" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="270" y="140" font-weight="600">FCC ×4 (vote)</text>
  <text x="255" y="165">modes · envelope</text>
  <text x="255" y="185">surface cmds 100 Hz</text>
  <text x="255" y="205">NWS (ground)</text>
  <!-- actuators -->
  <rect x="520" y="70" width="170" height="50" rx="4" fill="#fce4ec" stroke="#ad1457"/>
  <text x="545" y="100">EHA aileron L/R</text>
  <rect x="520" y="130" width="170" height="50" rx="4" fill="#fce4ec" stroke="#ad1457"/>
  <text x="540" y="160">EHA flaperon L/R</text>
  <rect x="520" y="190" width="170" height="50" rx="4" fill="#fce4ec" stroke="#ad1457"/>
  <text x="555" y="220">EHA HT / rudder</text>
  <rect x="520" y="250" width="170" height="40" rx="4" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="545" y="275">Gear / NWS acts</text>
  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <line x1="160" y1="120" x2="240" y2="140" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="160" y1="170" x2="240" y2="160" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="160" y1="220" x2="240" y2="180" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="160" y1="270" x2="280" y2="210" stroke="#ef6c00" marker-end="url(#arrow)"/>
  <line x1="440" y1="150" x2="520" y2="95" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="440" y1="160" x2="520" y2="155" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="440" y1="170" x2="520" y2="215" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="440" y1="200" x2="520" y2="270" stroke="#6a1b9a" marker-end="url(#arrow)"/>
  <text x="16" y="310" fill="#555">No mechanical reversion · MC cannot bypass FCC · study PWM parallels logical channels only</text>
</svg>
